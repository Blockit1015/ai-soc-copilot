[tool.pytest.ini_options]
filterwarnings = [
    # 忽略所有 DeprecationWarning（最常用，但可能掩盖你自己代码的警告）
    "ignore::DeprecationWarning",
    
    # 精确忽略：只忽略 Pydantic V1 相关的弃用警告
    "ignore:Pydantic V1 style:DeprecationWarning",
    
    # 精确忽略：只忽略 starlette.testclient 相关的弃用警告
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
]